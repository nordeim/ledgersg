# .github/workflows/ci.yml
# LedgerSG Enterprise CI/CD Pipeline
# SQL-First Architecture Validation with PostgreSQL RLS
#
# This pipeline institutionalizes the "SQL-First" mandate by:
# 1. Manually initializing PostgreSQL with database_schema.sql (not migrations)
# 2. Running pytest with --no-migrations and --reuse-db flags
# 3. Validating the backend suite (1047 tests, P33 — +11 the currency-truth gates: the Peppol amount-currencyID thread, the reports denomination, the account-balance currency) against the true production schema; the unified closed-class ruff gate (P30+P31+P32/CFG-M3: production + tests)
# 4. Running the always-green no-backend e2e subset (P18/CFG-L1)
#
# Version: 1.2.1 (P19: the ci-summary gate now includes security-scan)
# Last Updated: 2026-11-28

name: LedgerSG Enterprise CI

# P10/M-11 (corrected, P11/L-7 comment rewritten cleanly): the P10 audit
# READ the trigger as corrupted YAML — the displayed form
# "branches: ain, develop]" was the agent tooling layer's display
# artifact (a two-character sequence, open-bracket followed by "m", is
# eaten from displayed tool output), not file corruption. Byte-level
# verification of the pre-change commit confirmed the on-disk trigger
# always read "branches: [main, develop]" and CI always fired on main.
# What the P10 change actually did: narrowed the branch list to main
# only (the repo's single-branch convention; develop does not exist) and
# moved the npm cache key to the lockfile. Lesson recorded: verify
# surprising file contents byte-level before remediating.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  POSTGRES_USER: ledgersg
  # Per-run generated credential (P5/C-3): nothing secret is committed, the
  # service container and the test job share this value, and the DB is
  # ephemeral per run. config/settings/testing.py reads DB_PASSWORD from env.
  POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
  POSTGRES_DB: ledgersg_dev
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432

jobs:
  # ============================================================================
  # BACKEND TESTS: Django 6 / Pytest with SQL-First Database Initialization
  # ============================================================================
  backend-tests:
    name: Backend Tests (Django 6 / Pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgersg
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: ledgersg_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          # pyproject.toml is the canonical manifest (P1/A-6) — requirements.txt
          # at the repo root is the stale second manifest.
          cache-dependency-path: "apps/backend/pyproject.toml"

      - name: 📦 Install Backend Dependencies
        working-directory: ./apps/backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 🧹 Mechanical Lint Gate (P30+P31+P32/CFG-M3 — the closed classes at 0, whole tree)
        working-directory: ./apps/backend
        run: |
          echo "🧹 Running the closed-class ruff ratchet..."
          # P30/BE-P30-H1 closed the mechanical classes (whitespace,
          # import order, unused imports, the settings star-import
          # contract) on the production tree; P31 closed the B904
          # exception-chaining batch (66 → 0, the from-exc/from-None
          # contract) and extended the mechanical closure to the tests
          # tree; P32 closed the dead-code/shadow/name/suppress set
          # (F841/F811/F402/E741/A001/N806/B009/B017/B905/C408/SIM1xx/
          # UP015/UP017/E402/S608 + the tests-tree S105/S106/S108
          # per-file-ignores contract) — this gate pins them ALL at 0
          # across the whole tree so they cannot silently regress. The
          # 148 production + 73 tests semantic findings stay in the
          # deferred register (make lint is the full report).
          ruff check --select W291,W293,I001,F401,F403,F405,B904,F841,F811,F402,E741,A001,N806,N802,B007,B009,B017,B905,C408,SIM103,SIM105,SIM108,SIM110,SIM117,SIM118,SIM300,UP015,UP017,S608,E402,S105,S106,S108 apps common config tests
          echo "✅ Mechanical lint gate passed (0 findings in the closed classes)"

      - name: 🗄️ Initialize Unmanaged SQL Schema (SQL-First Mandate)
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
          echo "🔄 Initializing SQL-First database schema..."
          
          # Wait for PostgreSQL to be ready
          for i in {1..10}; do
            if pg_isready -h ${{ env.POSTGRES_HOST }} -U ${{ env.POSTGRES_USER }}; then
              echo "✅ PostgreSQL is ready"
              break
            fi
            echo "⏳ Waiting for PostgreSQL... (attempt $i/10)"
            sleep 2
          done
          
          # 1. Create the test database
          echo "📁 Creating test_ledgersg_dev database..."
          createdb -h ${{ env.POSTGRES_HOST }} -U ${{ env.POSTGRES_USER }} test_ledgersg_dev
          
          # 2. Inject the source-of-truth schema into the test database
          echo "🔄 Loading database_schema.sql..."
          psql -h ${{ env.POSTGRES_HOST }} -U ${{ env.POSTGRES_USER }} -d test_ledgersg_dev -f apps/backend/database_schema.sql
          
          # 3. Verify schema loaded
          echo "✅ Schema loaded successfully. Verifying tables..."
          psql -h ${{ env.POSTGRES_HOST }} -U ${{ env.POSTGRES_USER }} -d test_ledgersg_dev -c "\dt core.*" | head -20
          
          echo "✅ Database initialization complete"

      - name: 🧪 Run Backend Tests (Meticulous Workflow)
        working-directory: ./apps/backend
        env:
          # P17/DOC-L: DATABASE_URL removed — nothing reads it (the backend
          # reads the five DB_* variables; see apps/backend/.env.example)
          DB_NAME: test_ledgersg_dev
          DB_USER: ${{ env.POSTGRES_USER }}
          DB_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          DB_HOST: ${{ env.POSTGRES_HOST }}
          DB_PORT: ${{ env.POSTGRES_PORT }}
          REDIS_URL: redis://localhost:6379/1
          SECRET_KEY: test_secret_key_for_ci_pipeline
          DJANGO_SETTINGS_MODULE: config.settings.testing
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
          echo "🧪 Running backend tests with SQL-First configuration..."
          echo "📊 Configuration:"
          echo "   - DB_NAME: test_ledgersg_dev (schema-loaded via psql above)"
          echo "   - REDIS_URL: redis://localhost:6379/1"
          echo "   - DJANGO_SETTINGS_MODULE: config.settings.testing"
          echo ""
          
          # Run tests avoiding migrations and reusing our precisely built schema
          # --no-migrations: Prevents Django from trying to run migrations (schema already loaded)
          # --reuse-db: Forces pytest to use our manually created test_ledgersg_dev database
          pytest --reuse-db --no-migrations -v --tb=short
          
          echo "✅ Backend tests completed"

  # ============================================================================
  # FRONTEND TESTS: Next.js 16 / TypeScript / Vitest
  # ============================================================================
  frontend-tests:
    name: Frontend Tests (Next.js 16 / Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          # P10/M-11: the npm cache keys off the LOCKFILE — package.json
          # changes on every dependency bump, invalidating the cache
          # uselessly; the lockfile changes only when the tree changes.
          cache-dependency-path: "apps/web/package-lock.json"

      - name: 📦 Install Frontend Dependencies
        working-directory: ./apps/web
        run: |
          echo "📦 Installing frontend dependencies..."
          npm ci
          echo "✅ Dependencies installed"

      - name: 🔎 TypeScript Strict Check
        working-directory: ./apps/web
        run: |
          echo "🔍 Running TypeScript strict check..."
          npx tsc --noEmit
          echo "✅ TypeScript check passed"

      - name: 🧹 ESLint Gate (0 errors, 0 warnings — clean since P19)
        working-directory: ./apps/web
        run: |
          echo "🧹 Running the whole-tree eslint gate..."
          # P17/FE-M2: whole-tree eslint 0 errors. P19 cleared the last
          # 5 parity warnings — the register is 0E/0W; --max-warnings 5
          # remains as the drift guard so the count cannot ratchet
          # silently again (the P16 lesson: 6 errors lived for a sprint
          # because no CI step ran lint).
          npx eslint . --max-warnings 5
          echo "✅ ESLint gate passed (0 errors, 0 warnings)"

      - name: 🧪 Run Frontend Tests (coverage ratchet)
        working-directory: ./apps/web
        run: |
          echo "🧪 Running frontend tests with the coverage ratchet..."
          # P11/M-9: npm test could never fail on coverage — the P10/M-13
          # ratchet (npm run test:coverage) is the REAL gate; CI runs it.
          npm run test:coverage
          echo "✅ Frontend tests completed at the ratchet"

      - name: 🏗️ Build Verification
        working-directory: ./apps/web
        run: |
          echo "🏗️ Verifying production build..."
          npm run build:server
          echo "✅ Build successful"

  # ============================================================================
  # E2E TESTS (no-backend subset): the always-green 11 specs
  # P18/CFG-L1: the Playwright suite's no-backend specs (11 always-run;
  # the backend-gated 29 skip with reasons when E2E_API_URL is unset) were
  # never executed in CI — the config's webServer self-boots the frontend
  # (npm run dev), so a chromium-only job covers them with no backend
  # service. The live suite (e2e:full, 40 specs) stays a local/dev-stack
  # gate: it mutates shared backend state and needs Django + Redis + the
  # demo substrate.
  # ============================================================================
  e2e-tests:
    name: E2E Tests (Playwright / no-backend subset)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: 📦 Install Frontend Dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: 🎭 Install Playwright Chromium
        working-directory: ./apps/web
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run E2E (the always-green no-backend subset)
        working-directory: ./apps/web
        run: |
          echo "🧪 Running the no-backend e2e subset (webServer self-boots)..."
          # No E2E_API_URL: the backend-gated specs skip with documented
          # reasons; the 11 no-backend specs must all pass.
          npx playwright test
          echo "✅ E2E subset passed"

      - name: 📤 Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ============================================================================
  # SECURITY SCAN: Dependency vulnerabilities
  # ============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, e2e-tests]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install Project (scan the real dependency tree)
        working-directory: ./apps/backend
        run: |
          # P11/M-9: the old job installed ONLY safety+bandit and scanned
          # its own two packages — the project's dependency tree was never
          # in scope, and `|| true` made failure impossible by design.
          python -m pip install --upgrade pip
          pip install -e ".[dev]" safety bandit

      - name: 🔍 Backend Security Check
        working-directory: ./apps/backend
        run: |
          # Safety scans the INSTALLED project tree (pyproject/lock) and
          # FAILS the job on a known-vulnerable dependency.
          safety check
          # Bandit findings upload as an artifact (advisory — the repo's
          # registered backend ruff/bandit debt is tracked in the
          # deferred register, not gate-failed here).
          bandit -r apps -f json -o bandit-report.json || true

      - name: 📤 Upload Bandit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: apps/backend/bandit-report.json

      - name: 🔍 Frontend Security Check
        working-directory: ./apps/web
        run: |
          # Advisory only (P11/M-9): audit failures gate nothing — next
          # transitive bumps are tracked in the deferred register.
          npm audit --audit-level=moderate || true

  # ============================================================================
  # SUMMARY: Overall CI Status
  # ============================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, e2e-tests, security-scan]
    if: always()

    steps:
      - name: 📊 CI Summary
        run: |
          echo "========================================"
          echo "📊 LedgerSG CI/CD Pipeline Summary"
          echo "========================================"
          echo ""
          echo "Backend Tests: ${{ needs.backend-tests.result == 'success' && '✅ PASSED' || '❌ FAILED' }}"
          echo "Frontend Tests: ${{ needs.frontend-tests.result == 'success' && '✅ PASSED' || '❌ FAILED' }}"
          echo "E2E Tests: ${{ needs.e2e-tests.result == 'success' && '✅ PASSED' || '❌ FAILED' }}"
          echo "Security Scan: ${{ needs.security-scan.result == 'success' && '✅ PASSED' || '❌ FAILED' }}"
          echo ""
          echo "Overall Status: ${{ (needs.backend-tests.result == 'success' && needs.frontend-tests.result == 'success' && needs.e2e-tests.result == 'success' && needs.security-scan.result == 'success') && '✅ ALL CHECKS PASSED' || '❌ SOME CHECKS FAILED' }}"
          echo "========================================"

      - name: ✅ Mark as Success
        if: needs.backend-tests.result == 'success' && needs.frontend-tests.result == 'success' && needs.e2e-tests.result == 'success' && needs.security-scan.result == 'success'
        run: echo "All critical tests passed!"

      - name: ❌ Mark as Failed
        if: needs.backend-tests.result != 'success' || needs.frontend-tests.result != 'success' || needs.e2e-tests.result != 'success' || needs.security-scan.result != 'success'
        run: |
          echo "Some tests failed. Please review the logs above."
          exit 1
